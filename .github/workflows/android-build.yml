name: Android APK Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "${SDKMANAGER}" ]; then
            echo "sdkmanager was not found under ${ANDROID_HOME}/cmdline-tools"
            find "${ANDROID_HOME}" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "Found sdkmanager: ${SDKMANAGER}"
          echo "$(dirname "${SDKMANAGER}")" >> "$GITHUB_PATH"
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          # sdkmanager handles the input; ignore SIGPIPE from 'yes' after it exits.
          set +o pipefail
          yes | sdkmanager --licenses
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare persistent signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64}" ]; then
            KEYSTORE_PATH="${RUNNER_TEMP}/oldtv-upload.jks"
            printf '%s' "${KEYSTORE_B64}" | base64 --decode > "${KEYSTORE_PATH}"
            chmod 600 "${KEYSTORE_PATH}"
            echo "ANDROID_KEYSTORE_PATH=${KEYSTORE_PATH}" >> "$GITHUB_ENV"
            echo "Persistent signing key is configured."
          else
            echo "Persistent signing key is not configured; a formal release cannot be built."
          fi
      - name: Verify formal release signing configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_PATH:-}" || { echo "Missing persistent signing keystore"; exit 1; }
          test -f "${ANDROID_KEYSTORE_PATH}" || { echo "Signing keystore file not found"; exit 1; }
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oldtv-revival-26.4.1-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
