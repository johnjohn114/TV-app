name: Android APK Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "${SDKMANAGER}" ]; then
            echo "sdkmanager was not found under ${ANDROID_HOME}/cmdline-tools"
            find "${ANDROID_HOME}" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "Found sdkmanager: ${SDKMANAGER}"
          echo "$(dirname "${SDKMANAGER}")" >> "$GITHUB_PATH"
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          # sdkmanager handles the input; ignore SIGPIPE from 'yes' after it exits.
          set +o pipefail
          yes | sdkmanager --licenses
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oldtv-revival-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
