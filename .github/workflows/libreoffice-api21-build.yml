name: LibreOffice API 21 ARM64 Editing APK PoC

on:
  push:
    branches:
      - research/26.5.0-office-engine
    paths:
      - ".github/workflows/libreoffice-api21-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-libreoffice-editing:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo apt-get clean
          docker system prune -af || true
          df -h

      - name: Install LibreOffice build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            7zip ant ant-optional autoconf automake bison build-essential \
            flex gperf junit4 nasm python3-dev libfontconfig1-dev libkrb5-dev \
            libnss3-dev libservlet-api-java libxml2-utils libxslt1-dev \
            meson ninja-build unzip xsltproc zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          test -n "$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME"
          df -h

      - name: Install pinned Android platform and NDK
        shell: bash
        run: |
          set -euxo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_API_LEVEL=21" >> "$GITHUB_ENV"
          df -h

      - name: Checkout OldTV research branch
        uses: actions/checkout@v4
        with:
          path: oldtv

      - name: Checkout LibreOffice source used by F-Droid build 123
        uses: actions/checkout@v4
        with:
          repository: LibreOffice/core
          ref: cd7284b4cbbfeb507e630c1aac019f4157393acb
          path: libreoffice
          fetch-depth: 1
          submodules: recursive

      - name: Verify pinned source and prepare F-Droid build recipe
        working-directory: libreoffice
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "cd7284b4cbbfeb507e630c1aac019f4157393acb"

          # Apply the same source adjustments used by F-Droid's reproducible
          # LibreOffice Viewer 26.2.5.2 ARM64 editing build (versionCode 123).
          sed -i -e '/rm /d' android/source/Makefile
          sed -i -e '/maven {/I,+2 d' android/source/build.gradle
          sed -i -e '/debug/d' android/CustomTarget_lo_android.mk
          sed -i -e '/JAVA_HOME=/i CLASSPATH=/usr/share/java/servlet-api.jar \\' external/hsqldb/ExternalProject_hsqldb.mk

          ./autogen.sh --enable-release-build \
            --with-vendor=F-Droid \
            --with-android-package-name="org.documentfoundation.libreoffice" \
            --with-android-ndk="$ANDROID_NDK_HOME" \
            --with-android-sdk="$ANDROID_HOME" \
            --with-distro=LibreOfficeAndroidAarch64 \
            --enable-android-editing

      - name: Fetch LibreOffice external source archives
        working-directory: libreoffice
        shell: bash
        run: |
          set -euxo pipefail
          make fetch
          mkdir -p external/tarballs/extracted
          cd external/tarballs
          shopt -s nullglob
          for archive in *.{tar.bz2,tar.gz,tar.xz,tgz,zip}; do
            mkdir -p "extracted/$archive"
            7z x -o"extracted/$archive" "$archive"
            rm "$archive"
          done
          cd ../..
          mkdir -p instdir/program/classes/
          touch instdir/program/classes/java_uno.jar instdir/program/classes/juh.jar instdir/program/classes/jurt.jar instdir/program/classes/ridl.jar instdir/program/classes/unoloader.jar instdir/program/classes/unoil.jar

      - name: Generate Android Gradle settings
        working-directory: libreoffice/android/source
        run: make liboSettings.gradle versionCode=123

      - name: Build native core and Android editing APK
        working-directory: libreoffice
        shell: bash
        run: |
          set -euxo pipefail
          cd android/source
          pushd ../../external/tarballs/extracted/
          shopt -s nullglob
          for archive in *.{tar.bz2,tar.gz,tar.xz,tgz,zip}; do
            pushd "$archive"
            7z a "../../$archive" *
            popd
          done
          popd
          cd ../../
          rm -rf workdir instdir
          make versionCode=123
          cd android/source
          ./gradlew --no-daemon -PcmdVersionCode=123 assembleStrippedUIEditingRelease
          cd ../..
          echo 'APK files produced under Android source:'
          find android/source -type f -name '*.apk' -print
          APK_PATH=$(find android/source -type f -name '*.apk' -print -quit)
          test -n "$APK_PATH"
          test -s "$APK_PATH"
          ls -lh "$APK_PATH"
          df -h

      - name: Align and sign the PoC APK for Android 5
        working-directory: oldtv
        shell: bash
        run: |
          set -euxo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED_APK=$(find "$GITHUB_WORKSPACE/libreoffice/android/source" -type f -name '*unsigned.apk' -print -quit)
          test -n "$UNSIGNED_APK"
          test -s "$UNSIGNED_APK"
          mkdir -p "$GITHUB_WORKSPACE/oldtv/build/outputs/apk"
          keytool -genkeypair -v \\
            -keystore "$RUNNER_TEMP/oldtv-poc.jks" \\
            -storepass oldtv-poc-test \\
            -keypass oldtv-poc-test \\
            -alias oldtv-poc \\
            -keyalg RSA -keysize 2048 -validity 10000 \\
            -dname "CN=OldTV Revival PoC, O=Test, C=TW"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED_APK" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \\
            --ks "$RUNNER_TEMP/oldtv-poc.jks" \\
            --ks-key-alias oldtv-poc \\
            --ks-pass pass:oldtv-poc-test \\
            --key-pass pass:oldtv-poc-test \\
            --min-sdk-version 21 \\
            --v1-signing-enabled true \\
            --v2-signing-enabled true \\
            --out "$GITHUB_WORKSPACE/oldtv/build/outputs/apk/LibreOffice-26.2.5.2-API21-ARM64-Editing-PoC.apk" \\
            "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs \\
            "$GITHUB_WORKSPACE/oldtv/build/outputs/apk/LibreOffice-26.2.5.2-API21-ARM64-Editing-PoC.apk"
          "$BUILD_TOOLS/aapt" dump badging \\
            "$GITHUB_WORKSPACE/oldtv/build/outputs/apk/LibreOffice-26.2.5.2-API21-ARM64-Editing-PoC.apk" | head -20
          ls -lh "$GITHUB_WORKSPACE/oldtv/build/outputs/apk/LibreOffice-26.2.5.2-API21-ARM64-Editing-PoC.apk"

      - name: Upload standalone LibreOffice editing APK
        uses: actions/upload-artifact@v4
        with:
          name: LibreOffice-26.2.5.2-API21-ARM64-Editing-PoC
          path: |
            oldtv/build/outputs/apk/LibreOffice-26.2.5.2-API21-ARM64-Editing-PoC.apk
          if-no-files-found: error
          retention-days: 14
